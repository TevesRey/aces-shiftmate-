<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
  <div class="bg-surface w-full max-w-2xl max-h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-200">
    <div class="flex items-center justify-between p-6 border-b border-text-muted/10">
      <h3 class="text-xl font-bold text-primary">{{ title }}</h3>
      <button (click)="closeModal()" class="p-2 hover:bg-text-muted/10 rounded-full transition-colors text-text-muted">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="p-6 overflow-y-auto">
      <ng-content></ng-content>
    </div>
  </div>
</div>
