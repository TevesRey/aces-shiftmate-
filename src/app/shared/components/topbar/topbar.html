<div class="h-16 w-full bg-white border-b border-text-muted/10 px-4 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-4">
    <button
      (click)="toggleSidebar()"
      class="p-2 rounded-lg hover:bg-slate-100 transition-colors text-text-main"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <div class="hidden sm:block">
      <h1 class="text-lg font-bold text-primary leading-none">{{ pageTitle }}</h1>
      <p class="text-xs text-text-muted leading-tight">{{ pageSubtitle }}</p>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <button class="p-2 rounded-full hover:bg-slate-100 transition-colors text-text-muted relative">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V6a2 2 0 10-4 0v.341C7.67 6.162 6 8.358 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6-3v1.5//path></svg>
      <span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-secondary border-2 border-white"></span>
    </button>

    <div class="flex items-center gap-3 pl-4 border-l border-text-muted/10 cursor-pointer group">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-primary leading-none">{{ user.name }}</p>
        <p class="text-[10px] text-text-muted leading-none mt-1">{{ user.role }}</p>
      </div>
      <app-avatar [name]="user.name" [status]="user.status" size="sm"></app-avatar>
    </div>
  </div>
</div >
