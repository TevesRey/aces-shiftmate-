<app-card class="p-8">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-primary">Welcome back</h2>
    <p class="text-text-muted mt-2">Sign in to your ShiftMate account to continue.</p>
  </div>

  <form class="space-y-5">
    <div class="space-y-1">
      <label class="block text-sm font-medium text-text-main">Email</label>
      <input
        type="email"
        placeholder="name@company.com"
        [class]="'w-full px-3 py-2 border rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary ' + (hasError ? 'border-red-500' : 'border-text-muted/30')"
      />
      <p *ngIf="hasError" class="text-xs text-red-500 mt-1">Please enter a valid email address.</p>
    </div>

    <div class="space-y-1">
      <div class="flex justify-between items-center">
        <label class="block text-sm font-medium text-text-main">Password</label>
        <a href="/auth/forgot-password" class="text-xs font-medium text-secondary hover:underline">Forgot password?</a>
      </div>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
      />
    </div>

    <div class="flex items-center gap-2">
      <input type="checkbox" id="remember" class="rounded text-secondary focus:ring-secondary h-4 w-4" />
      <label for="remember" class="text-sm text-text-muted">Remember me</label>
    </div>

    <app-button variant="primary" class="w-full" [disabled]="isLoading">
      {{ isLoading ? 'Signing in...' : 'Sign In' }}
    </app-button>
  </form>

  <div class="mt-8 text-center">
    <p class="text-sm text-text-muted">
      Don't have an account?
      <a href="/auth/register" class="font-medium text-secondary hover:underline">Create an account</a>
    </p>
  </div>
</app-card>
