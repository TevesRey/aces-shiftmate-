<app-card class="p-8">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-primary">Forgot your password?</h2>
    <p class="text-text-muted mt-2">Enter your email address and we'll help you get back into your account.</p>
  </div>

  <form class="space-y-6">
    <div class="space-y-1">
      <label class="block text-sm font-medium text-text-main">Email</label>
      <input
        type="email"
        placeholder="name@company.com"
        class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
      />
    </div>

    <app-button variant="primary" class="w-full" [disabled]="isLoading">
      {{ isLoading ? 'Sending link...' : 'Send Reset Link' }}
    </app-button>
  </form>

  <div class="mt-8 text-center">
    <a href="/auth/login" class="text-sm font-medium text-secondary hover:underline">Back to Sign In</a>
  </div>
</app-card>
