<app-card class="p-8">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-primary">Create your ShiftMate account</h2>
    <p class="text-text-muted mt-2">Start managing your workforce with a simpler approach to scheduling.</p>
  </div>

  <form class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-sm font-medium text-text-main">First Name</label>
        <input
          type="text"
          placeholder="John"
          class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
        />
      </div>
      <div class="space-y-1">
        <label class="block text-sm font-medium text-text-main">Last Name</label>
        <input
          type="text"
          placeholder="Doe"
          class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
        />
      </div>
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-text-main">Email</label>
      <input
        type="email"
        placeholder="name@company.com"
        class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
      />
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-text-main">Password</label>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
      />
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-text-main">Confirm Password</label>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full px-3 py-2 border border-text-muted/30 rounded-lg transition-colors outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary"
      />
    </div>

    <div class="pt-4">
      <app-button variant="primary" class="w-full" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Create Account' }}
      </app-button>
    </div>
  </form>

  <div class="mt-8 text-center">
    <p class="text-sm text-text-muted">
      Already have an account?
      <a href="/auth/login" class="font-medium text-secondary hover:underline">Sign in</a>
    </p>
  </div>
</app-card>
