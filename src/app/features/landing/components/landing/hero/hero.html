<section class="relative overflow-hidden bg-background py-20 lg:py-32">
  <!-- Background Decoration -->
  <div class="absolute -top-24 -left-24 h-96 w-96 rounded-full bg-secondary/10 blur-3xl"></div>
  <div class="absolute top-1/2 -right-24 h-96 w-96 rounded-full bg-primary/5 blur-3xl"></div>

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid items-center gap-12 lg:grid-cols-2">

      <!-- Text Content -->
      <div class="text-center lg:text-left">
        <span class="inline-block rounded-full bg-secondary/10 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-secondary">
          Workforce Management, Simplified
        </span>
        <h1 class="mt-6 text-4xl font-extrabold tracking-tight text-primary sm:text-5xl lg:text-6xl">
          Smarter Shifts.<br />
          <span class="text-secondary">Better Teams.</span>
        </h1>
        <p class="mt-6 text-lg leading-8 text-text-muted sm:text-xl">
          Manage employees, organize schedules, and keep your workforce running smoothly — all in one place.
        </p>
        <div class="mt-10 flex flex-col items-center gap-4 sm:flex-row lg:justify-start">
          <app-button variant="primary" size="lg">Get Started</app-button>
          <app-button variant="outline" size="lg">Explore Features</app-button>
        </div>
      </div>

      <!-- Product Mockup -->
      <div class="relative mt-12 lg:mt-0">
        <div class="relative rounded-2xl border border-text-muted/20 bg-white p-2 shadow-2xl">
          <!-- Browser Top Bar -->
          <div class="flex items-center gap-1.5 rounded-t-lg bg-slate-100 px-4 py-3">
            <div class="h-3 w-3 rounded-full bg-red-400"></div>
            <div class="h-3 w-3 rounded-full bg-amber-400"></div>
            <div class="h-3 w-3 rounded-full bg-green-400"></div>
            <div class="ml-4 flex-1 rounded-md bg-white px-3 py-1 text-center text-[10px] text-slate-400">
              app.shiftmate.com/dashboard
            </div>
          </div>
          <!-- Mockup Content -->
          <div class="overflow-hidden rounded-b-lg bg-slate-50 p-4">
            <!-- Mock Header -->
            <div class="mb-6 flex items-center justify-between">
              <div class="h-4 w-32 rounded bg-slate-200"></div>
              <div class="h-8 w-8 rounded-full bg-slate-300"></div>
            </div>
            <!-- Mock Grid -->
            <div class="grid grid-cols-2 gap-4">
              <div class="h-24 rounded-lg bg-white border border-slate-200 p-3 shadow-sm">
                <div class="h-2 w-12 rounded bg-slate-200 mb-2"></div>
                <div class="h-4 w-20 rounded bg-slate-300"></div>
              </div>
              <div class="h-24 rounded-lg bg-white border border-slate-200 p-3 shadow-sm">
                <div class="h-2 w-12 rounded bg-slate-200 mb-2"></div>
                <div class="h-4 w-20 rounded bg-slate-300"></div>
              </div>
              <div class="col-span-2 h-32 rounded-lg bg-white border border-slate-200 p-3 shadow-sm">
                <div class="h-3 w-24 rounded bg-slate-200 mb-3"></div>
                <div class="space-y-2">
                  <div class="h-2 w-full rounded bg-slate-100"></div>
                  <div class="h-2 w-5/6 rounded bg-slate-100"></div>
                  <div class="h-2 w-4/6 rounded bg-slate-100"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Floating Elements -->
        <div class="absolute -bottom-6 -left-6 hidden rounded-lg bg-white p-4 shadow-xl lg:block animate-bounce-slow">
          <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-full bg-accent flex items-center justify-center text-white">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
            </div>
            <div>
              <p class="text-xs font-bold text-text-main">Shift Confirmed</p>
              <p class="text-[10px] text-text-muted">John Doe: Monday 9AM</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
